alerts:
  - name: HighLatencyP95
    severity: warning
    condition: p95(latency_ms) > 3000ms
    duration: 5m
    type: symptom-based
    channel: slack
    owner: student-2A202602984
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: critical
    condition: error_rate > 2%
    duration: 3m
    type: symptom-based
    channel: slack
    owner: student-2A202602984
    runbook: docs/alerts.md#alert-2
  - name: LowRetrievalSuccessRate
    severity: critical
    condition: retrieval_success_rate < 90%
    duration: 5m
    type: symptom-based
    channel: slack
    owner: student-2A202602984
    runbook: docs/alerts.md#alert-3
